[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jparty"
dynamic = ["version"]
description = "The Jeopardy party game"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.12.0,<7",
    "requests>=2.34.2,<3",
    "tornado>=6.6.1,<7",
    "BeautifulSoup4>=4.15.0,<5",
    "qrcode>=8.2,<9",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.22.3,<7",
]
test = [
    "pre-commit",
    "pytest",
    "pytest-qt",
    "pytest-mock",
    "requests-mock",
    "pytest-cov",
    "playwright",
    "ruff",
]

[project.scripts]
jparty = "jparty.app.bootstrap:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "jparty._version.__version__"}

# uv reinstalls the project only when a cache key changes. The version lives
# in _version.py, so list it too; otherwise a version bump leaves the installed
# package metadata on the old version.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/jparty/_version.py" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jparty = [
    "assets/data/*",
    "assets/data/saved_games/*",
    "assets/buzzer/templates/*",
    "assets/buzzer/static/*",
]

[tool.ruff.lint]
# Pin Ruff's former defaults so newer Ruff releases don't silently add rules.
select = ["E4", "E7", "E9", "F"]
extend-select = [
  # select above keeps all F and a subset of E rules
  # for a description of rulesets and examples, see:
  # https://docs.astral.sh/ruff/rules/
  "ANN",    # flake8-annotations - type annotations, some ignored
  "B",      # bugbear - identifies likely bugs
  "C4",     # flake8-comprehensions - identifies redundant calls in comprehensions
  "D",      # pydocstyle - requires docstrings on all public modules/functions/classes
  "I",      # isort
  "N801",   # pep8-naming - enforce ClassNamesStyle
  "N804",   # pep8-naming - first arg of classmethod should be cls
  "N805",   # pep8-naming - first arg of method should be self
  "PD",     # pandas-vet
  "PLR2004",# Pylint no magic values!
  "PTH",    # prefer pathlib over os.path as seems to be the consensus
  "Q",      # flake8-quotes - double quotes preferred (like black)
  "S",      # flake8-bandit - security checks
  "UP",     # pyupgrade - requires preferred syntax in newer python versions
  "YTT",    # flake8-2020 - corrects code that doesn't anticipate 2 digit python minor version  
]

ignore = [
  "D415",   # allow first line of doctstrings to end without punctuation
  "ANN002", # missing type on *args
  "ANN003", # missing type on **kwargs
  "B905",   # zip() without strict=; not enforced yet
  "S608"    # not worried about sql injection for local database
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "S603"]
"tests/conftest.py" = [
  "E402", # Test bootstrap needs to add the src/ path before importing the package.
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".runtime_tmp*", ".tmp", "pytest-cache-files-*", ".pytest_cache"]
markers = [
  "unit: pure parsing and state reconstruction tests",
  "integration: integration tests using fakes and monkeypatching",
  "qt: Qt widget tests",
  "e2e: end-to-end and smoke tests",
  "build: builds the PyInstaller app; opt in with JPARTY_RUN_BUILD_TEST=1",
]
addopts = "-ra -p no:cacheprovider"
