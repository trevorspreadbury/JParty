# Base conda environment. Dependency pins live in pyproject.toml; this file only
# provides Python and pip, then installs JParty from the repo checkout.
# Run from the repo root. Add extras afterwards as needed, e.g.
# `pip install -e .[test]` for tests or `pip install -e .[build]` for PyInstaller.
name: JParty
dependencies:
  - python>=3.11
  - pip
  - pip:
      - -e .
