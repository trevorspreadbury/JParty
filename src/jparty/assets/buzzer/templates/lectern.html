<!DOCTYPE html>
<html>
    <head>
        <title>JParty! Lectern</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="{{ static_url('lectern.js') }}" type="text/javascript"></script>
        <link rel="stylesheet" href="{{ static_url('lectern.css') }}">
        <!-- Loaded without blocking the page, so a laptop with no internet
             still shows the lectern, in a fallback font. -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Anton" media="print" onload="this.media='all'">
    </head>
    <body>
        <!-- Everything is drawn inside this box. lectern.js turns it for
             monitors mounted on their side (press R). -->
        <div class="lectern-container" id="lectern-container">
            <div class="lights-container" id="lights-container">
                <div class="light" data-light="1"></div>
                <div class="light" data-light="2"></div>
                <div class="light" data-light="3"></div>
                <div class="light" data-light="4"></div>
                <div class="light" data-light="5"></div>
                <div class="light" data-light="6"></div>
                <div class="light" data-light="7"></div>
                <div class="light" data-light="8"></div>
                <div class="light" data-light="9"></div>
            </div>
            <div class="score-box" id="score-box">
                <div id="player-score" class="player-score">$0</div>
            </div>
            <div class="answering-box" id="answering-box"></div>
            <div class="name-box" id="name-box">
                <img id="logo" class="logo" src="{{ static_url('logo.jpg') }}" alt="JParty Logo">
                <div id="player-name" class="player-name" style="display: none;"></div>
            </div>
            <div class="seat-picker" id="seat-picker" style="display: none;">
                <div class="seat-picker-title">Which lectern is this?</div>
                <div class="seat-picker-buttons" id="seat-picker-buttons"></div>
                <div class="key-help">Press a number to choose</div>
                <div class="key-help" id="seat-picker-key-help"></div>
            </div>
            <div class="lectern-toast" id="lectern-toast" style="display: none;">
                <div class="lectern-toast-seat" id="lectern-toast-seat"></div>
                <div class="key-help" id="lectern-key-help"></div>
            </div>
        </div>
        <script>
            // Zero-based seat from the URL, or null to use the seat this
            // browser last showed (or ask for one).
            var playerNumber = {% if player_number is None %}null{% else %}{{ player_number }}{% end %};
            var maxPlayers = {{ max_players }};
        </script>
    </body>
</html>
